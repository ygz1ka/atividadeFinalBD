<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Pessoas</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <h1>Cadastro de Pessoas</h1>
        <p>Sistema de gerenciamento</p>
    </header>
    <main>
        <form id="formCadastro">
            <h2>Novo cadastro</h2>
            <input type="hidden" id="pessoaId">
            <div>
                <label for="nome">Nome:</label>
                <input type="text" id="nome" name="nome" maxlength="100" required>
            </div>
            <div>
                <label for="email">E-mail:</label>
                <input type="email" id="email" name="email" maxlength="150" required>
            </div>
            <div>
                <label for="telefone">Telefone:</label>
                <input type="tel" id="telefone" name="telefone" maxlength="20">
            </div>
            <div>
                <label for="data_nascimento">Data de nascimento:</label>
                <input type="date" id="data_nascimento" name="data_nascimento">
            </div>
            <div>
                <button type="submit">Cadastrar</button>
                <button type="button" id="btnCancelar" hidden>
                    Cancelar edição
                </button>
            </div>
        </form>

        <p id="mensagem"></p>
        <h2>Pessoas Cadastradas</h2>
        <button type="button" id="btnConsultar">Consultar Pessoas</button>
        <div class="tabela">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nome</th>
                        <th>E-mail</th>
                        <th>Telefone</th>
                        <th>Data de Nascimento</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody id="listaPessoas"></tbody>
            </table>
        </div>

        <script src="script.js"></script>
    </main>
</body>

</html>
